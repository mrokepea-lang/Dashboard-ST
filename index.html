<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEA Dashboard</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- นำเข้า Babel สำหรับแปลง JSX ให้ทำงานบน Browser ได้ -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- กำหนด Import Map สำหรับ React, Lucide-React และ Recharts -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom"
        }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <!-- จุดสำหรับ Render React App -->
    <div id="root"></div>

    <!-- ส่วนของโค้ด React (JSX) -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          LayoutDashboard, 
          Table as TableIcon, 
          Settings, 
          Zap, 
          TrendingUp, 
          AlertCircle, 
          CheckCircle2, 
          Clock, 
          Search,
          Menu,
          X,
          User,
          Bell,
          Download,
          Activity,
          ClipboardCheck
        } from 'lucide-react';
        import { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer } from 'recharts';

        // --- Components ---
        const Card = ({ children, className = "" }) => (
          <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden ${className}`}>
            {children}
          </div>
        );

        const StatCard = ({ title, value, icon: Icon, colorClass, trend }) => (
          <Card className="p-6 transition-all hover:shadow-md">
            <div className="flex justify-between items-start">
              <div>
                <p className="text-sm font-medium text-gray-500 mb-1">{title}</p>
                <h3 className="text-3xl font-bold text-gray-800">{value}</h3>
                {trend && (
                  <p className="text-xs font-medium text-emerald-500 flex items-center mt-2">
                    <TrendingUp size={14} className="mr-1" />
                    {trend}
                  </p>
                )}
              </div>
              <div className={`p-3 rounded-xl ${colorClass}`}>
                <Icon size={24} />
              </div>
            </div>
          </Card>
        );

        // --- Main Application ---
        function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
          
          // Data States
          const [data, setData] = useState([]);
          const [columns, setColumns] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState(null);
          const [searchTerm, setSearchTerm] = useState('');

          // Google Sheet ID from user's link
          const SHEET_ID = '11ZtVKSybV-sNuTV0fZpk2chHXVj4hdeo';

          // Mock Data for PEA context (Fallback)
          const mockData = [
            { id: 'PRJ-001', name: 'ปรับปรุงระบบจำหน่ายไฟฟ้าแรงสูง', region: 'กฟภ. ภาคเหนือ 1', status: 'อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ' },
            { id: 'PRJ-002', name: 'ก่อสร้างสถานีไฟฟ้าเชียงใหม่ 3', region: 'กฟภ. ภาคเหนือ 1', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
            { id: 'PRJ-003', name: 'ขยายเขตไฟฟ้าหมู่บ้านห่างไกล', region: 'กฟภ. ภาคตะวันออกเฉียงเหนือ 2', status: 'Pending' },
            { id: 'PRJ-004', name: 'ติดตั้งระบบ Smart Grid', region: 'กฟภ. สำนักงานใหญ่', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
            { id: 'PRJ-005', name: 'ซ่อมบำรุงหม้อแปลงประจำปี', region: 'กฟภ. ภาคใต้ 3', status: 'อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ' },
            { id: 'PRJ-006', name: 'โครงการเปลี่ยนมิเตอร์', region: 'กฟภ. ภาคกลาง 1', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
            { id: 'PRJ-007', name: 'พัฒนาระบบ', region: 'กฟภ. สำนักงานใหญ่', status: 'Pending' },
          ];
          const mockColumns = ['รหัสโครงการ', 'ชื่อโครงการ', 'หน่วยงานที่ร้องขอบริการทดสอบ', 'สถานะ'];

          useEffect(() => {
            fetchGoogleSheetData();
          }, []);

          const fetchGoogleSheetData = async () => {
            setLoading(true);
            try {
              // Using Google Visualization API to get public sheet data as JSON
              const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
              const response = await fetch(url);
              
              if (!response.ok) throw new Error('Network response was not ok');
              
              const text = await response.text();
              // Extract JSON from the JSONP response
              const start = text.indexOf('{');
              const end = text.lastIndexOf('}');
              if (start === -1 || end === -1) throw new Error('Invalid JSON response');
              
              const jsonString = text.substring(start, end + 1);
              const jsonData = JSON.parse(jsonString);

              // Parse Columns
              const cols = jsonData.table.cols.map(c => c.label || 'ไม่ระบุชื่อคอลัมน์');
              
              // Parse Rows (กรองแถวว่างออก)
              const rows = jsonData.table.rows.map(row => {
                const rowData = {};
                row.c.forEach((cell, i) => {
                  rowData[cols[i]] = cell ? (cell.v !== null ? cell.v : cell.f) : '';
                });
                return rowData;
              }).filter(row => {
                return Object.values(row).some(val => val !== null && val !== undefined && String(val).trim() !== '');
              });

              if (rows.length > 0) {
                setColumns(cols);
                setData(rows);
                setError(null);
              } else {
                throw new Error('ไม่พบข้อมูลใน Sheet');
              }

            } catch (err) {
              console.warn('Failed to fetch from Google Sheets, using Mock Data:', err);
              // Fallback to Mock Data
              setColumns(mockColumns);
              setData(mockData);
              setError('ไม่สามารถเชื่อมต่อ Google Sheet ได้ (อาจติดสิทธิ์ Private) ระบบกำลังแสดงผลข้อมูลจำลองเพื่อการสาธิต');
            } finally {
              setLoading(false);
            }
          };

          // --- Derived Statistics ---
          const stats = useMemo(() => {
            const totalProjects = data.length;
            let gwvTesting = 0;
            let inProgress = 0;
            let reportedCount = 0;

            data.forEach(item => {
              // นับจำนวนงานจากคอลัมน์สถานะ
              const status = String(item['สถานะ'] || item.status || '').trim();
              
              if (status.includes('อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ')) {
                gwvTesting++;
              } else if (status.includes('อยู่ระหว่าง กทฟ. ทดสอบ') || status.includes('กำลัง') || status.toLowerCase().includes('progress')) {
                inProgress++;
              }

              // นับจำนวนงานที่รายงานผลแล้ว (ตรวจสอบเฉพาะคอลัมน์ "สถานะ")
              if (status.includes('รายงานผล') || status.includes('ทดสอบแล้ว')) {
                reportedCount++;
              }
            });

            return {
              totalProjects,
              gwvTesting,
              inProgress,
              reportedCount
            };
          }, [data]);

          // --- Department Stats for Pie Chart ---
          const departmentStats = useMemo(() => {
            const counts = {};
            data.forEach(item => {
              // ค้นหาคอลัมน์ "หน่วยงานที่ร้องขอ" เป็นหลัก
              const dept = String(item['หน่วยงานที่ร้องขอ'] || item['หน่วยงานที่ร้องขอบริการทดสอบ'] || item['หน่วยงาน'] || 'ไม่ระบุ').trim();
              if (dept && dept !== 'undefined' && dept !== 'null' && dept !== '') {
                counts[dept] = (counts[dept] || 0) + 1;
              }
            });
            
            const total = Object.values(counts).reduce((a, b) => a + b, 0);
            
            return Object.entries(counts)
              .map(([name, value]) => ({
                name: name.length > 15 ? name.substring(0, 15) + '...' : name,
                fullName: name, // เก็บชื่อเต็มไว้โชว์ตอน Hover (Tooltip)
                value,
                percentage: total > 0 ? ((value / total) * 100).toFixed(2) : "0.00"
              }))
              .sort((a, b) => b.value - a.value); // เรียงจากจำนวนมากไปน้อย
          }, [data]);

          const PIE_COLORS = ['#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#6366F1', '#14B8A6', '#F43F5E', '#84CC16'];

          // --- Filtered Data ---
          const filteredData = useMemo(() => {
            return data.filter(item => {
              return Object.values(item).some(val => 
                String(val).toLowerCase().includes(searchTerm.toLowerCase())
              );
            });
          }, [data, searchTerm]);

          // --- Render Helpers ---
          const formatValue = (key, value) => {
            if (typeof value === 'number') {
              if (key.includes('งบประมาณ') || key.includes('budget')) {
                return value.toLocaleString('th-TH');
              }
              return value;
            }
            return value;
          };

          const getStatusBadge = (status) => {
            const s = String(status).trim();
            if (s.includes('อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ')) {
              return <span className="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium flex items-center w-fit"><CheckCircle2 size={12} className="mr-1"/> อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ</span>;
            } else if (s.includes('อยู่ระหว่าง กทฟ. ทดสอบ') || s.toLowerCase().includes('progress') || s.includes('กำลัง')) {
              return <span className="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium flex items-center w-fit"><Activity size={12} className="mr-1"/> อยู่ระหว่าง กทฟ. ทดสอบ</span>;
            } else if (s.toLowerCase().includes('pending') || s.includes('รอ')) {
              return <span className="px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-medium flex items-center w-fit"><Clock size={12} className="mr-1"/> รอดำเนินการ</span>;
            }
            return <span className="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-xs font-medium">{status}</span>;
          };

          return (
            <div className="min-h-screen flex flex-col md:flex-row font-sans">
              
              {/* Sidebar - Desktop */}
              <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-gradient-to-b from-[#5E1D8B] to-[#3B0964] text-white transition-transform duration-300 ease-in-out transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 shadow-xl`}>
                <div className="flex items-center justify-between p-6">
                  <div className="flex items-center space-x-3">
                    <div className="p-2 bg-white/10 rounded-lg">
                      <Zap size={28} className="text-yellow-400" />
                    </div>
                    <span className="text-xl font-bold tracking-wider">PEA DASHBOARD</span>
                  </div>
                  <button className="md:hidden text-white/70 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}>
                    <X size={24} />
                  </button>
                </div>

                <div className="px-4 py-2 text-xs font-semibold text-white/50 uppercase tracking-wider mb-2">เมนูหลัก</div>
                <nav className="px-3 space-y-1">
                  <button 
                    onClick={() => {setActiveTab('dashboard'); setIsMobileMenuOpen(false);}}
                    className={`w-full flex items-center px-4 py-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-white/10 text-white font-medium shadow-sm border border-white/5' : 'text-white/70 hover:bg-white/5 hover:text-white'}`}
                  >
                    <LayoutDashboard size={20} className="mr-3" />
                    ภาพรวมระบบ
                  </button>
                  <button 
                    onClick={() => {setActiveTab('data'); setIsMobileMenuOpen(false);}}
                    className={`w-full flex items-center px-4 py-3 rounded-xl transition-all ${activeTab === 'data' ? 'bg-white/10 text-white font-medium shadow-sm border border-white/5' : 'text-white/70 hover:bg-white/5 hover:text-white'}`}
                  >
                    <TableIcon size={20} className="mr-3" />
                    ตารางข้อมูล
                  </button>
                </nav>

                <div className="absolute bottom-0 left-0 right-0 p-6">
                  <div className="bg-white/10 rounded-xl p-4 border border-white/5">
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 to-yellow-200 flex items-center justify-center text-purple-900 font-bold">
                        A
                      </div>
                      <div>
                        <p className="text-sm font-medium text-white">ผู้ดูแลระบบ</p>
                        <p className="text-xs text-white/60">admin@pea.co.th</p>
                      </div>
                    </div>
                  </div>
                </div>
              </aside>

              {/* Main Content */}
              <main className="flex-1 flex flex-col h-screen overflow-hidden">
                
                {/* Top Header */}
                <header className="bg-white shadow-sm border-b border-gray-100 z-10">
                  <div className="flex items-center justify-between px-6 py-4">
                    <div className="flex items-center">
                      <button 
                        className="md:hidden mr-4 text-gray-500 hover:text-purple-700 transition-colors"
                        onClick={() => setIsMobileMenuOpen(true)}
                      >
                        <Menu size={24} />
                      </button>
                      <h1 className="text-xl font-bold text-gray-800 hidden sm:block">
                        {activeTab === 'dashboard' ? 'ภาพรวมการดำเนินงาน' : 'ฐานข้อมูลจาก Google Sheet'}
                      </h1>
                    </div>
                    
                    <div className="flex items-center space-x-4">
                      <div className="relative hidden md:block">
                        <Search size={18} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                        <input 
                          type="text" 
                          placeholder="ค้นหาข้อมูล..." 
                          className="pl-10 pr-4 py-2 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent bg-gray-50"
                          value={searchTerm}
                          onChange={(e) => setSearchTerm(e.target.value)}
                        />
                      </div>
                      <button className="relative p-2 text-gray-400 hover:text-purple-600 transition-colors rounded-full hover:bg-purple-50">
                        <Bell size={20} />
                        <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                      </button>
                    </div>
                  </div>
                </header>

                {/* Content Area */}
                <div className="flex-1 overflow-auto p-4 md:p-6 lg:p-8 bg-slate-50/50">
                  
                  {error && (
                    <div className="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl flex items-start text-amber-800 shadow-sm">
                      <AlertCircle size={20} className="mr-3 flex-shrink-0 mt-0.5 text-amber-500" />
                      <div>
                        <h4 className="font-semibold text-amber-900">การแจ้งเตือน</h4>
                        <p className="text-sm mt-1">{error}</p>
                      </div>
                    </div>
                  )}

                  {loading ? (
                    <div className="h-full flex flex-col items-center justify-center text-purple-700">
                      <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-700 mb-4"></div>
                      <p className="font-medium">กำลังโหลดข้อมูลจาก Google Sheet...</p>
                    </div>
                  ) : (
                    <>
                      {/* --- DASHBOARD TAB --- */}
                      {activeTab === 'dashboard' && (
                        <div className="space-y-6">
                          
                          {/* Stats Row */}
                          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                            <StatCard 
                              title="จำนวนรายการทั้งหมด" 
                              value={stats.totalProjects} 
                              icon={LayoutDashboard} 
                              colorClass="bg-purple-100 text-purple-600"
                            />
                            <StatCard 
                              title="อยู่ระหว่าง กทฟ. ทดสอบ" 
                              value={stats.inProgress} 
                              icon={Activity} 
                              colorClass="bg-blue-100 text-blue-600"
                            />
                            <StatCard 
                              title="อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ" 
                              value={stats.gwvTesting} 
                              icon={CheckCircle2} 
                              colorClass="bg-emerald-100 text-emerald-600"
                            />
                            <StatCard 
                              title="รายงานผลทดสอบ" 
                              value={stats.reportedCount} 
                              icon={ClipboardCheck} 
                              colorClass="bg-indigo-100 text-indigo-600"
                            />
                          </div>

                          {/* Charts & Details Row */}
                          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            
                            {/* Pie Chart Card */}
                            <Card className="lg:col-span-1 p-6 flex flex-col">
                              <h3 className="text-lg font-bold text-gray-800 mb-2 flex items-center">
                                <Zap size={20} className="mr-2 text-purple-600" />
                                หน่วยงานที่ร้องขอบริการทดสอบ
                              </h3>
                              <p className="text-xs text-gray-500 mb-6">สัดส่วนปริมาณงานแยกตามหน่วยงาน</p>
                              
                              <div className="flex-1 min-h-[320px] w-full flex items-center justify-center">
                                {departmentStats.length > 0 ? (
                                  <ResponsiveContainer width="100%" height="100%">
                                    <PieChart>
                                      <Pie
                                        data={departmentStats}
                                        cx="50%"
                                        cy="50%"
                                        innerRadius={60}
                                        outerRadius={85}
                                        paddingAngle={2}
                                        dataKey="value"
                                      >
                                        {departmentStats.map((entry, index) => (
                                          <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} />
                                        ))}
                                      </Pie>
                                      <Tooltip 
                                        formatter={(value, name, props) => [`${value} รายการ (${props.payload.percentage}%)`, props.payload.fullName]}
                                        contentStyle={{ fontSize: '14px', borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                                        itemStyle={{ fontWeight: '600', color: '#334155' }}
                                      />
                                      <Legend 
                                        verticalAlign="bottom" 
                                        content={(props) => {
                                          const { payload } = props;
                                          return (
                                            <ul className="flex flex-wrap justify-center gap-x-6 gap-y-4 pt-4">
                                              {payload.map((entry, index) => (
                                                <li key={`item-${index}`} className="flex items-start">
                                                  <span className="w-3 h-3 rounded-full mt-1 mr-2 flex-shrink-0" style={{ backgroundColor: entry.color }}></span>
                                                  <div className="flex flex-col">
                                                    <span className="text-sm font-medium text-gray-700 leading-tight">{entry.value}</span>
                                                    <span className="text-xs font-semibold text-purple-600 mt-1">
                                                      ร้อยละ {entry.payload.percentage} <span className="text-gray-400 font-normal">({entry.payload.value} รายการ)</span>
                                                    </span>
                                                  </div>
                                                </li>
                                              ))}
                                            </ul>
                                          );
                                        }}
                                      />
                                    </PieChart>
                                  </ResponsiveContainer>
                                ) : (
                                  <div className="text-gray-400 text-sm">ไม่พบข้อมูลหน่วยงาน</div>
                                )}
                              </div>
                            </Card>

                            {/* Recent Data Preview */}
                            <Card className="lg:col-span-2 p-0 flex flex-col">
                              <div className="p-6 border-b border-gray-100 flex justify-between items-center">
                                <h3 className="text-lg font-bold text-gray-800">ข้อมูลอัปเดตล่าสุด</h3>
                                <button 
                                  onClick={() => setActiveTab('data')}
                                  className="text-sm text-purple-600 font-medium hover:text-purple-800 flex items-center"
                                >
                                  ดูทั้งหมด <TrendingUp size={16} className="ml-1 rotate-90" />
                                </button>
                              </div>
                              <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                  <thead>
                                    <tr className="bg-gray-50/50 text-gray-500 text-xs uppercase tracking-wider">
                                      {columns.slice(0, 4).map((col, i) => (
                                        <th key={i} className="px-6 py-4 font-semibold">{col}</th>
                                      ))}
                                    </tr>
                                  </thead>
                                  <tbody className="text-sm">
                                    {data.slice(0, 5).map((row, i) => (
                                      <tr key={i} className="border-t border-gray-50 hover:bg-purple-50/30 transition-colors">
                                        {columns.slice(0, 4).map((col, j) => (
                                          <td key={j} className="px-6 py-4 text-gray-700">
                                            {col.includes('สถานะ') || col.includes('status') 
                                              ? getStatusBadge(row[col] || row[Object.keys(row)[j]]) 
                                              : formatValue(col, row[col] || row[Object.keys(row)[j]])}
                                          </td>
                                        ))}
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </Card>

                          </div>
                        </div>
                      )}

                      {/* --- DATA TABLE TAB --- */}
                      {activeTab === 'data' && (
                        <Card className="flex flex-col h-[calc(100vh-120px)]">
                          <div className="p-6 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-white sticky top-0 z-10">
                            <div>
                              <h3 className="text-xl font-bold text-gray-800">ฐานข้อมูลทั้งหมด</h3>
                              <p className="text-sm text-gray-500 mt-1">แสดงข้อมูล {filteredData.length} รายการจาก Google Sheet</p>
                            </div>
                            <div className="flex w-full sm:w-auto space-x-3">
                               <div className="relative flex-1 sm:w-64">
                                <Search size={18} className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                <input 
                                  type="text" 
                                  placeholder="ค้นหาในตาราง..." 
                                  className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-50"
                                  value={searchTerm}
                                  onChange={(e) => setSearchTerm(e.target.value)}
                                />
                              </div>
                              <button className="flex items-center px-4 py-2 bg-purple-50 text-purple-700 rounded-xl hover:bg-purple-100 transition-colors text-sm font-medium border border-purple-100">
                                <Download size={16} className="mr-2" />
                                Export
                              </button>
                            </div>
                          </div>
                          
                          <div className="flex-1 overflow-auto bg-gray-50/30">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                              <thead className="sticky top-0 bg-white shadow-sm z-10">
                                <tr className="text-gray-500 text-sm">
                                  <th className="px-6 py-4 font-semibold w-12 text-center border-b border-gray-200">#</th>
                                  {columns.map((col, i) => (
                                    <th key={i} className="px-6 py-4 font-semibold border-b border-gray-200 whitespace-nowrap">{col}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody className="text-sm bg-white">
                                {filteredData.length > 0 ? (
                                  filteredData.map((row, i) => (
                                    <tr key={i} className="border-b border-gray-50 hover:bg-purple-50/50 transition-colors group">
                                      <td className="px-6 py-4 text-center text-gray-400 font-medium">{i + 1}</td>
                                      {columns.map((col, j) => (
                                        <td key={j} className="px-6 py-4 text-gray-700">
                                          {col.includes('สถานะ') || col.includes('status') 
                                              ? getStatusBadge(row[col] || row[Object.keys(row)[j]]) 
                                              : formatValue(col, row[col] || row[Object.keys(row)[j]])}
                                        </td>
                                      ))}
                                    </tr>
                                  ))
                                ) : (
                                  <tr>
                                    <td colSpan={columns.length + 1} className="px-6 py-12 text-center text-gray-500 bg-gray-50/50">
                                      <div className="flex flex-col items-center justify-center">
                                        <Search size={32} className="text-gray-300 mb-3" />
                                        <p className="text-base font-medium text-gray-600">ไม่พบข้อมูลที่ค้นหา</p>
                                        <p className="text-sm mt-1">ลองเปลี่ยนคำค้นหาใหม่</p>
                                      </div>
                                    </td>
                                  </tr>
                                )}
                              </tbody>
                            </table>
                          </div>
                          <div className="p-4 border-t border-gray-100 bg-white text-xs text-gray-500 flex justify-between items-center">
                            <span>เชื่อมต่อกับ Google Sheets API (gviz) แล้ว</span>
                            <span>อัปเดตล่าสุด: {new Date().toLocaleTimeString('th-TH')}</span>
                          </div>
                        </Card>
                      )}
                    </>
                  )}

                </div>
              </main>

            </div>
          );
        }

        // Render the App to the root div
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
