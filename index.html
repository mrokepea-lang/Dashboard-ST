<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEA Dashboard - Executive View</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- นำเข้า Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            pea: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#3B0964',
            }
          }
        }
      }
    }
  </script>

  <!-- นำเข้า Babel สำหรับแปลง JSX ให้ทำงานบน Browser ได้ -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- กำหนด Import Map สำหรับ React, Lucide-React และ Recharts -->
  <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "recharts": "https://esm.sh/recharts@2.12.0?external=react,react-dom"
        }
    }
    </script>

  <style>
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Subtle page background */
    body {
      background-color: #f8fafc;
      background-image:
        radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 0.03) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 0.03) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 0.03) 0, transparent 50%);
    }

    /* Glass effect utilities */
    .glass-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
  </style>
</head>

<body class="text-slate-800 font-sans selection:bg-pea-500 selection:text-white min-h-screen">
  <!-- จุดสำหรับ Render React App -->
  <div id="root"></div>

  <!-- ส่วนของโค้ด React (JSX) -->
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      LayoutDashboard,
      Table as TableIcon,
      Settings,
      Zap,
      TrendingUp,
      AlertCircle,
      CheckCircle2,
      Clock,
      Search,
      Menu,
      X,
      User,
      Bell,
      Download,
      Activity,
      ClipboardCheck,
      ChevronRight,
      BarChart2,
      Calendar
    } from 'lucide-react';
    import { PieChart, Pie, Cell, Tooltip, Legend, ResponsiveContainer, BarChart, Bar, XAxis, YAxis, CartesianGrid } from 'recharts';

    // --- Components ---
    const Card = ({ children, className = "" }) => (
      <div className={`glass-panel rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden ${className}`}>
        {children}
      </div>
    );

    const StatCard = ({ title, value, icon: Icon, colorClass, trend, trendValue }) => (
      <Card className="p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_12px_40px_rgb(0,0,0,0.08)] relative overflow-hidden group cursor-default">
        {/* Decorative background element */}
        <div className={`absolute -right-6 -top-6 w-32 h-32 rounded-full opacity-5 transition-transform duration-700 group-hover:scale-150 bg-gradient-to-br ${colorClass}`}></div>

        <div className="flex justify-between items-start relative z-10">
          <div>
            <p className="text-sm font-semibold text-slate-500 mb-2 uppercase tracking-wide">{title}</p>
            <h3 className="text-4xl font-bold text-slate-800 tracking-tight mb-2">{value}</h3>
            {trendValue && (
              <div className="flex items-center mt-3 text-sm">
                <span className={`flex items-center font-semibold px-2 py-0.5 rounded-full ${trend === 'up' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                  <TrendingUp size={14} className={`mr-1 ${trend === 'down' ? 'rotate-180' : ''}`} />
                  {trendValue}
                </span>
                <span className="text-slate-400 ml-2 text-xs font-medium">เทียบกับเดือนที่แล้ว</span>
              </div>
            )}
          </div>
          <div className={`p-4 rounded-2xl bg-gradient-to-br ${colorClass} shadow-lg shadow-${colorClass.split('-')[1]}/30`}>
            <Icon size={28} className="text-white" />
          </div>
        </div>
      </Card>
    );

    // --- Main Application ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      // Data States
      const [data, setData] = useState([]);
      const [columns, setColumns] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');

      // Google Sheet ID
      const SHEET_ID = '11ZtVKSybV-sNuTV0fZpk2chHXVj4hdeo';

      // Mock Data for PEA context (Fallback)
      const mockData = [
        { id: 'PRJ-001', name: 'ปรับปรุงระบบจำหน่ายไฟฟ้าแรงสูง', region: 'กฟภ. ภาคเหนือ 1', status: 'อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ' },
        { id: 'PRJ-002', name: 'ก่อสร้างสถานีไฟฟ้าเชียงใหม่ 3', region: 'กฟภ. ภาคเหนือ 1', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
        { id: 'PRJ-003', name: 'ขยายเขตไฟฟ้าหมู่บ้านห่างไกล', region: 'กฟภ. ภาคตะวันออกเฉียงเหนือ 2', status: 'Pending' },
        { id: 'PRJ-004', name: 'ติดตั้งระบบ Smart Grid', region: 'กฟภ. สำนักงานใหญ่', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
        { id: 'PRJ-005', name: 'ซ่อมบำรุงหม้อแปลงประจำปี', region: 'กฟภ. ภาคใต้ 3', status: 'อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ' },
        { id: 'PRJ-006', name: 'โครงการเปลี่ยนมิเตอร์', region: 'กฟภ. ภาคกลาง 1', status: 'อยู่ระหว่าง กทฟ. ทดสอบ' },
        { id: 'PRJ-007', name: 'พัฒนาระบบ', region: 'กฟภ. สำนักงานใหญ่', status: 'Pending' },
      ];
      const mockColumns = ['รหัสโครงการ', 'ชื่อโครงการ', 'หน่วยงานที่ร้องขอบริการทดสอบ', 'สถานะ'];

      useEffect(() => {
        fetchGoogleSheetData();
      }, []);

      const fetchGoogleSheetData = async () => {
        setLoading(true);
        try {
          const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
          const response = await fetch(url);

          if (!response.ok) throw new Error('Network response was not ok');

          const text = await response.text();
          const start = text.indexOf('{');
          const end = text.lastIndexOf('}');
          if (start === -1 || end === -1) throw new Error('Invalid JSON response');

          const jsonString = text.substring(start, end + 1);
          const jsonData = JSON.parse(jsonString);

          const cols = jsonData.table.cols.map(c => c.label || 'ไม่ระบุชื่อคอลัมน์');

          const rows = jsonData.table.rows.map(row => {
            const rowData = {};
            row.c.forEach((cell, i) => {
              rowData[cols[i]] = cell ? (cell.v !== null ? cell.v : cell.f) : '';
            });
            return rowData;
          }).filter(row => {
            return Object.values(row).some(val => val !== null && val !== undefined && String(val).trim() !== '');
          });

          if (rows.length > 0) {
            setColumns(cols);
            setData(rows);
            setError(null);
          } else {
            throw new Error('ไม่พบข้อมูลใน Sheet');
          }

        } catch (err) {
          console.warn('Failed to fetch from Google Sheets, using Mock Data:', err);
          setColumns(mockColumns);
          setData(mockData);
          setError('ไม่สามารถเชื่อมต่อ Google Sheet ได้ ระบบกำลังแสดงผลข้อมูลจำลองเพื่อการสาธิต');
        } finally {
          setLoading(false);
        }
      };

      // --- Derived Statistics ---
      const stats = useMemo(() => {
        const totalProjects = data.length;
        let gwvTesting = 0;
        let inProgress = 0;
        let reportedCount = 0;

        data.forEach(item => {
          const status = String(item['สถานะ'] || item.status || '').trim();

          if (status.includes('อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ')) {
            gwvTesting++;
          } else if (status.includes('อยู่ระหว่าง กทฟ. ทดสอบ') || status.includes('กำลัง') || status.toLowerCase().includes('progress')) {
            inProgress++;
          }

          if (status.includes('รายงานผล') || status.includes('ทดสอบแล้ว')) {
            reportedCount++;
          }
        });

        return {
          totalProjects,
          gwvTesting,
          inProgress,
          reportedCount
        };
      }, [data]);

      // --- Department Stats for Pie Chart ---
      const departmentStats = useMemo(() => {
        const counts = {};
        data.forEach(item => {
          const dept = String(item['หน่วยงานที่ร้องขอ'] || item['หน่วยงานที่ร้องขอบริการทดสอบ'] || item['หน่วยงาน'] || 'ไม่ระบุ').trim();
          if (dept && dept !== 'undefined' && dept !== 'null' && dept !== '') {
            counts[dept] = (counts[dept] || 0) + 1;
          }
        });

        const total = Object.values(counts).reduce((a, b) => a + b, 0);

        return Object.entries(counts)
          .map(([name, value]) => ({
            name: name.length > 15 ? name.substring(0, 15) + '...' : name,
            fullName: name,
            value,
            percentage: total > 0 ? ((value / total) * 100).toFixed(2) : "0.00"
          }))
          .sort((a, b) => b.value - a.value);
      }, [data]);

      const PIE_COLORS = ['#8B5CF6', '#3B82F6', '#10B981', '#F59E0B', '#EC4899', '#6366F1', '#14B8A6', '#F43F5E', '#84CC16'];

      // --- Bar Chart Data ---
      const statusChartData = useMemo(() => {
        return [
          { name: 'กทฟ. ทดสอบ', value: stats.inProgress, fill: '#3B82F6' },
          { name: 'ผมท.กวว.(ก3)', value: stats.gwvTesting, fill: '#10B981' },
          { name: 'รายงานผลแล้ว', value: stats.reportedCount, fill: '#F97316' },
          { name: 'รอดำเนินการ', value: stats.totalProjects - (stats.inProgress + stats.gwvTesting + stats.reportedCount), fill: '#94A3B8' }
        ].filter(item => item.value > 0);
      }, [stats]);

      // --- Filtered Data ---
      const filteredData = useMemo(() => {
        return data.filter(item => {
          return Object.values(item).some(val =>
            String(val).toLowerCase().includes(searchTerm.toLowerCase())
          );
        });
      }, [data, searchTerm]);

      // --- Render Helpers ---
      const formatValue = (key, value) => {
        if (typeof value === 'number') {
          if (key.includes('งบประมาณ') || key.includes('budget')) {
            return value.toLocaleString('th-TH');
          }
          return value;
        }
        return value;
      };

      const getStatusBadge = (status) => {
        const s = String(status).trim();
        if (s.includes('อยู่ระหว่าง ผมท.กวว.(ก3) ทดสอบ')) {
          return <span className="px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-semibold flex items-center w-fit shadow-sm border border-emerald-200 whitespace-nowrap"><CheckCircle2 size={14} className="mr-1.5 shrink-0" /> ผมท.กวว.(ก3) ทดสอบ</span>;
        } else if (s.includes('อยู่ระหว่าง กทฟ. ทดสอบ') || s.toLowerCase().includes('progress') || s.includes('กำลัง')) {
          return <span className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-full text-xs font-semibold flex items-center w-fit shadow-sm border border-blue-200 whitespace-nowrap"><Activity size={14} className="mr-1.5 shrink-0" /> กทฟ. ทดสอบ</span>;
        } else if (s.toLowerCase().includes('pending') || s.includes('รอ')) {
          return <span className="px-3 py-1.5 bg-amber-100 text-amber-700 rounded-full text-xs font-semibold flex items-center w-fit shadow-sm border border-amber-200 whitespace-nowrap"><Clock size={14} className="mr-1.5 shrink-0" /> รอดำเนินการ</span>;
        }
        return <span className="px-3 py-1.5 bg-slate-100 text-slate-700 rounded-full text-xs font-semibold border border-slate-200 shadow-sm whitespace-nowrap">{status}</span>;
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row">

          {/* Sidebar - Premium Dark/Glass */}
          <aside className={`fixed inset-y-0 left-0 z-50 w-72 bg-[#2d0a4e] text-white transition-transform duration-300 ease-in-out transform ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:relative md:translate-x-0 shadow-2xl overflow-hidden`}>
            {/* Decorative glows */}
            <div className="absolute top-0 left-0 w-full h-64 bg-pea-600 rounded-full blur-[80px] opacity-20 -translate-y-1/2 -translate-x-1/2"></div>
            <div className="absolute bottom-0 right-0 w-full h-64 bg-fuchsia-600 rounded-full blur-[80px] opacity-10 translate-y-1/2 translate-x-1/2"></div>

            <div className="relative z-10 flex flex-col h-full">
              <div className="flex items-center justify-between p-6 mb-4">
                <div className="flex items-center space-x-3">
                  <div className="p-2.5 bg-gradient-to-br from-yellow-300 to-yellow-500 rounded-xl shadow-lg shadow-yellow-500/30">
                    <Zap size={24} className="text-[#2d0a4e] fill-current" />
                  </div>
                  <div>
                    <span className="block text-xl font-bold tracking-wider leading-none">PEA</span>
                    <span className="block text-[10px] font-medium tracking-widest text-pea-200 uppercase mt-1">Executive Dashboard</span>
                  </div>
                </div>
                <button className="md:hidden text-white/70 hover:text-white" onClick={() => setIsMobileMenuOpen(false)}>
                  <X size={24} />
                </button>
              </div>

              <div className="px-6 py-2 text-xs font-bold text-pea-300/70 uppercase tracking-widest mb-2">เมนูหลัก</div>
              <nav className="px-4 space-y-2 flex-1">
                <button
                  onClick={() => { setActiveTab('dashboard'); setIsMobileMenuOpen(false); }}
                  className={`w-full flex items-center px-4 py-3.5 rounded-2xl transition-all duration-300 ${activeTab === 'dashboard' ? 'bg-gradient-to-r from-pea-600 to-pea-700 text-white font-medium shadow-lg shadow-pea-900/50 border border-pea-500/30' : 'text-pea-200 hover:bg-white/5 hover:text-white'}`}
                >
                  <LayoutDashboard size={20} className="mr-3" />
                  ภาพรวมระบบ
                </button>
                <button
                  onClick={() => { setActiveTab('data'); setIsMobileMenuOpen(false); }}
                  className={`w-full flex items-center px-4 py-3.5 rounded-2xl transition-all duration-300 ${activeTab === 'data' ? 'bg-gradient-to-r from-pea-600 to-pea-700 text-white font-medium shadow-lg shadow-pea-900/50 border border-pea-500/30' : 'text-pea-200 hover:bg-white/5 hover:text-white'}`}
                >
                  <TableIcon size={20} className="mr-3" />
                  ตารางข้อมูล
                </button>
              </nav>

              <div className="p-6 mt-auto">
                <div className="bg-white/5 backdrop-blur-md rounded-2xl p-4 border border-white/10 hover:bg-white/10 transition-colors cursor-pointer group">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-3">
                      <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-yellow-400 to-orange-400 flex items-center justify-center text-[#2d0a4e] font-bold shadow-inner">
                        AD
                      </div>
                      <div>
                        <p className="text-sm font-bold text-white">ผู้ดูแลระบบ</p>
                        <p className="text-xs text-pea-200">admin@pea.co.th</p>
                      </div>
                    </div>
                    <Settings size={18} className="text-pea-300 group-hover:rotate-90 transition-transform duration-500" />
                  </div>
                </div>
              </div>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden relative">

            {/* Top Header - Glass */}
            <header className="glass-panel sticky top-0 z-40 border-b-0 border-white/40 mb-2">
              <div className="flex items-center justify-between px-8 py-5">
                <div className="flex items-center">
                  <button
                    className="md:hidden mr-4 text-slate-500 hover:text-pea-700 transition-colors"
                    onClick={() => setIsMobileMenuOpen(true)}
                  >
                    <Menu size={24} />
                  </button>
                  <div>
                    <h1 className="text-2xl font-bold text-slate-800 hidden sm:block tracking-tight">
                      {activeTab === 'dashboard' ? 'ภาพรวมการดำเนินงาน' : 'ฐานข้อมูลจาก Google Sheet'}
                    </h1>
                    <p className="text-sm text-slate-500 hidden sm:block font-medium mt-0.5">
                      อัปเดตข้อมูลล่าสุด: {new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-3 md:space-x-5">
                  <div className="relative hidden md:block group">
                    <Search size={18} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-pea-500 transition-colors" />
                    <input
                      type="text"
                      placeholder="ค้นหาข้อมูล..."
                      className="pl-11 pr-4 py-2.5 w-64 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-pea-500/50 focus:border-pea-500 bg-white/50 backdrop-blur-sm transition-all duration-300 shadow-sm"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                    />
                  </div>
                  <button className="relative p-2.5 text-slate-400 hover:text-pea-600 transition-colors rounded-full hover:bg-pea-50 bg-white shadow-sm border border-slate-100">
                    <Bell size={20} />
                    <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-white"></span>
                  </button>
                </div>
              </div>
            </header>

            {/* Content Area */}
            <div className="flex-1 overflow-auto px-4 py-4 md:px-8 md:py-6 relative z-10">

              {error && (
                <div className="mb-8 p-5 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-2xl flex items-start text-amber-800 shadow-sm">
                  <div className="bg-amber-100 p-2 rounded-xl mr-4 flex-shrink-0">
                    <AlertCircle size={24} className="text-amber-600" />
                  </div>
                  <div>
                    <h4 className="font-bold text-amber-900 text-base">พบปัญหาการเชื่อมต่อข้อมูล</h4>
                    <p className="text-sm mt-1 font-medium">{error}</p>
                  </div>
                </div>
              )}

              {loading ? (
                <div className="h-[60vh] flex flex-col items-center justify-center text-pea-700">
                  <div className="relative w-16 h-16 mb-6">
                    <div className="absolute inset-0 border-4 border-pea-200 rounded-full"></div>
                    <div className="absolute inset-0 border-4 border-pea-600 rounded-full border-t-transparent animate-spin"></div>
                  </div>
                  <p className="font-semibold text-lg tracking-wide">กำลังประมวลผลข้อมูลระดับผู้บริหาร...</p>
                </div>
              ) : (
                <div className="animate-in fade-in duration-500 slide-in-from-bottom-4">
                  {/* --- DASHBOARD TAB --- */}
                  {activeTab === 'dashboard' && (
                    <div className="space-y-8 max-w-7xl mx-auto">

                      {/* Stats Row */}
                      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                        <StatCard
                          title="จำนวนรายการทั้งหมด"
                          value={stats.totalProjects}
                          icon={LayoutDashboard}
                          colorClass="from-pea-500 to-pea-600"
                        />
                        <StatCard
                          title="อยู่ระหว่าง กทฟ. ทดสอบ"
                          value={stats.inProgress}
                          icon={Activity}
                          colorClass="from-blue-500 to-blue-600"
                        />
                        <StatCard
                          title="ผมท.กวว.(ก3) ทดสอบ"
                          value={stats.gwvTesting}
                          icon={CheckCircle2}
                          colorClass="from-emerald-400 to-emerald-500"
                        />
                        <StatCard
                          title="รายงานผลทดสอบ"
                          value={stats.reportedCount}
                          icon={ClipboardCheck}
                          colorClass="from-amber-400 to-orange-500"
                        />
                      </div>

                      {/* Charts & Details Row */}
                      <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">

                        {/* Pie Chart Card */}
                        <Card className="xl:col-span-1 p-8 flex flex-col justify-between min-h-[460px]">
                          <div>
                            <h3 className="text-xl font-bold text-slate-800 mb-1 flex items-center">
                              <div className="p-1.5 bg-pea-100 rounded-lg mr-3">
                                <Zap size={20} className="text-pea-600" />
                              </div>
                              สัดส่วนงานตามหน่วยงาน
                            </h3>
                            <p className="text-sm font-medium text-slate-500 mb-8 ml-10">ภาพรวมการให้บริการทดสอบแยกตามสังกัด</p>
                          </div>

                          <div className="flex-1 w-full flex items-center justify-center relative">
                            {departmentStats.length > 0 ? (
                              <>
                                <div className="absolute inset-0 flex items-center justify-center flex-col pointer-events-none pb-8">
                                  <span className="text-4xl font-bold text-slate-800">{stats.totalProjects}</span>
                                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">รายการ</span>
                                </div>
                                <ResponsiveContainer width="100%" height="100%">
                                  <PieChart>
                                    <Pie
                                      data={departmentStats}
                                      cx="50%"
                                      cy="45%"
                                      innerRadius={80}
                                      outerRadius={110}
                                      paddingAngle={3}
                                      dataKey="value"
                                      stroke="none"
                                    >
                                      {departmentStats.map((entry, index) => (
                                        <Cell key={`cell-${index}`} fill={PIE_COLORS[index % PIE_COLORS.length]} className="drop-shadow-sm" />
                                      ))}
                                    </Pie>
                                    <Tooltip
                                      formatter={(value, name, props) => [`${value} รายการ (${props.payload.percentage}%)`, props.payload.fullName]}
                                      contentStyle={{ fontSize: '14px', borderRadius: '16px', border: '1px solid #f1f5f9', boxShadow: '0 10px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)', padding: '12px 16px' }}
                                      itemStyle={{ fontWeight: '600', color: '#1e293b', paddingTop: '4px' }}
                                    />
                                    <Legend
                                      verticalAlign="bottom"
                                      content={(props) => {
                                        const { payload } = props;
                                        return (
                                          <ul className="flex flex-wrap justify-center gap-x-5 gap-y-3 pt-6">
                                            {payload.slice(0, 5).map((entry, index) => (
                                              <li key={`item-${index}`} className="flex items-center">
                                                <span className="w-3 h-3 rounded-full mr-2 shadow-sm" style={{ backgroundColor: entry.color }}></span>
                                                <span className="text-sm font-semibold text-slate-600">{entry.value}</span>
                                              </li>
                                            ))}
                                            {payload.length > 5 && (
                                              <li className="flex items-center text-sm font-medium text-slate-400">
                                                +{payload.length - 5} อื่นๆ
                                              </li>
                                            )}
                                          </ul>
                                        );
                                      }}
                                    />
                                  </PieChart>
                                </ResponsiveContainer>
                              </>
                            ) : (
                              <div className="text-slate-400 font-medium">ไม่พบข้อมูลหน่วยงาน</div>
                            )}
                          </div>
                        </Card>

                        {/* Recent Data Preview (Expanded to 2 columns) */}
                        <Card className="xl:col-span-2 p-0 flex flex-col min-h-[460px]">
                          <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-white/50">
                            <div>
                              <h3 className="text-xl font-bold text-slate-800">ข้อมูลอัปเดตล่าสุด</h3>
                              <p className="text-sm font-medium text-slate-500 mt-1">โครงการที่อยู่ในระบบเรียงตามการเปลี่ยนแปลงล่าสุด</p>
                            </div>
                            <button
                              onClick={() => setActiveTab('data')}
                              className="px-4 py-2 bg-slate-50 hover:bg-slate-100 text-pea-600 font-semibold rounded-xl flex items-center transition-all shadow-sm border border-slate-200"
                            >
                              ดูทั้งหมด <ChevronRight size={18} className="ml-1" />
                            </button>
                          </div>
                          <div className="overflow-x-auto p-4 flex-1">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="text-slate-400 text-xs uppercase tracking-widest border-b border-slate-100">
                                  {columns.slice(0, 4).map((col, i) => (
                                    <th key={i} className="px-6 py-4 font-bold">{col}</th>
                                  ))}
                                </tr>
                              </thead>
                              <tbody className="text-sm">
                                {data.slice(0, 5).map((row, i) => (
                                  <tr key={i} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/80 transition-colors group">
                                    {columns.slice(0, 4).map((col, j) => (
                                      <td key={j} className={`px-6 py-4 ${j === 1 ? 'font-semibold text-slate-800' : 'text-slate-600 font-medium'} ${(col.includes('สถานะ') || col.includes('status')) ? 'whitespace-nowrap' : ''}`}>
                                        {col.includes('สถานะ') || col.includes('status')
                                          ? getStatusBadge(row[col] || row[Object.keys(row)[j]])
                                          : formatValue(col, row[col] || row[Object.keys(row)[j]])}
                                      </td>
                                    ))}
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </Card>

                      </div>
                    </div>
                  )}

                  {/* --- DATA TABLE TAB --- */}
                  {activeTab === 'data' && (
                    <Card className="flex flex-col h-[calc(100vh-140px)] p-0">
                      <div className="p-6 border-b border-slate-100 flex flex-col xl:flex-row justify-between items-center gap-4 bg-white/80 sticky top-0 z-10 backdrop-blur-md">
                        <div>
                          <h3 className="text-2xl font-bold text-slate-800">ฐานข้อมูลโครงการทั้งหมด</h3>
                          <p className="text-sm font-medium text-slate-500 mt-1 flex items-center">
                            <span className="w-2 h-2 rounded-full bg-emerald-400 mr-2"></span>
                            แสดงผล {filteredData.length} รายการ จากระบบ Google Sheet
                          </p>
                        </div>
                        <div className="flex flex-col sm:flex-row w-full xl:w-auto gap-3">
                          <div className="relative flex-1 sm:w-72 group">
                            <Search size={18} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 group-focus-within:text-pea-500 transition-colors" />
                            <input
                              type="text"
                              placeholder="ค้นหาในตาราง..."
                              className="w-full pl-11 pr-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pea-500/50 focus:border-pea-500 bg-slate-50/50 transition-all font-medium"
                              value={searchTerm}
                              onChange={(e) => setSearchTerm(e.target.value)}
                            />
                          </div>
                          <button className="flex items-center justify-center px-5 py-2.5 bg-white text-pea-700 rounded-xl hover:bg-pea-50 transition-colors text-sm font-bold shadow-sm border border-slate-200">
                            <Download size={18} className="mr-2" />
                            Export
                          </button>
                        </div>
                      </div>

                      <div className="flex-1 overflow-auto bg-white/30">
                        <table className="w-full text-left border-collapse min-w-[1000px]">
                          <thead className="sticky top-0 bg-slate-50/95 backdrop-blur shadow-sm z-10">
                            <tr className="text-slate-500 text-xs uppercase tracking-widest">
                              <th className="px-6 py-5 font-bold w-16 text-center border-b border-slate-200">#</th>
                              {columns.map((col, i) => (
                                <th key={i} className="px-6 py-5 font-bold border-b border-slate-200 whitespace-nowrap">{col}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody className="text-sm">
                            {filteredData.length > 0 ? (
                              filteredData.map((row, i) => (
                                <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                  <td className="px-6 py-5 text-center text-slate-400 font-bold">{i + 1}</td>
                                  {columns.map((col, j) => (
                                    <td key={j} className={`px-6 py-5 ${j === 1 ? 'font-semibold text-slate-800' : 'text-slate-600 font-medium'} ${(col.includes('สถานะ') || col.includes('status')) ? 'whitespace-nowrap' : ''}`}>
                                      {col.includes('สถานะ') || col.includes('status')
                                        ? getStatusBadge(row[col] || row[Object.keys(row)[j]])
                                        : formatValue(col, row[col] || row[Object.keys(row)[j]])}
                                    </td>
                                  ))}
                                </tr>
                              ))
                            ) : (
                              <tr>
                                <td colSpan={columns.length + 1} className="px-6 py-20 text-center">
                                  <div className="flex flex-col items-center justify-center text-slate-500">
                                    <div className="p-4 bg-slate-100 rounded-full mb-4">
                                      <Search size={32} className="text-slate-400" />
                                    </div>
                                    <p className="text-lg font-bold text-slate-700">ไม่พบข้อมูลที่ค้นหา</p>
                                    <p className="text-sm font-medium mt-1">ลองเปลี่ยนคำค้นหาใหม่ หรือล้างตัวกรอง</p>
                                  </div>
                                </td>
                              </tr>
                            )}
                          </tbody>
                        </table>
                      </div>
                      <div className="p-4 bg-slate-50/80 border-t border-slate-200 text-xs font-semibold text-slate-500 flex justify-between items-center rounded-b-3xl">
                        <span className="flex items-center">
                          <div className="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></div>
                          Live Sync: Google Sheets API
                        </span>
                        <span>อัปเดตล่าสุด : ({new Date().toLocaleTimeString('th-TH')}</span>
                      </div>
                    </Card>
                  )}
                </div>
              )}

            </div>
          </main>

        </div>
      );
    }

    // Render the App to the root div
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
